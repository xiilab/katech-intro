server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA 라우팅: 정적 파일이 없으면 index.html로 fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # CRA 정적 리소스 캐싱
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}

